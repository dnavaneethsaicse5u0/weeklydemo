<!DOCTYPE html>
<html>
<head>
    <title>Weekly Timetable</title>
    <style>
       
        table {
            border-collapse: collapse; 
            width: 50%;         }
        table, th, td {
            border: 1px solid black;         }
        th, td {
            padding: 8px; 
            text-align: center; 
        }
        th {
            background-color: #f2f2f2; 
        }
    </style>
</head>
<body>
    <h2>Week Timetable</h2>
    <table>
        <tr>
            <th>Day</th>
            <th>9-10am</th>
            <th>10-11am</th>
            <th>11-12pm</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>Devops</td>
            <td>Software</td>
            <td>Java</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>ADA</td>
            <td>Maths</td>
            <td>Science</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>C</td>
            <td>DSA</td>
            <td>Devops</td>
        </tr>
    </table>
</body>
</html>
